<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <main>
      <section class="game-area" aria-label="Game space">
        <div class="game-space" role="img" aria-label="1280 by 720 game space"></div>

      <section id="about" class="card">
        <h2>About the game</h2>
        <p>
          This is the foundation for the game website. I will add game details,
          screenshots, and updates here.
        </p>
      </section>
    </main>

    <footer>
      <small>&copy; <span id="year"></span> New Game</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
